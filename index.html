<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>izesaki — AI Video Portfolio</title>
<meta name="description" content="AI video portfolio: short movies, music videos, ADs, and shorts.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#110e1a;
  --panel:#1a1626;
  --line:#2c2640;
  --text:#efe9f4;
  --muted:#9a91ad;
  --accent:#ff3d6e;
  --glow:#5ee0ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--glow);outline-offset:3px}
h1,h2,h3{font-family:'Syne',sans-serif;line-height:1.05;letter-spacing:-.02em}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* header */
header{position:sticky;top:0;z-index:50;background:rgba(17,14,26,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.15rem;letter-spacing:-.02em}
.logo i{font-style:normal;color:var(--accent)}
nav{display:flex;gap:26px}
nav a{font-size:.95rem;color:var(--muted);transition:color .2s}
nav a:hover{color:var(--text)}

/* title */
.top{padding:64px 0 10px}
.top h1{font-size:clamp(2rem,6vw,3.6rem);max-width:20ch}

/* work */
#work{padding:34px 0 60px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.tab{padding:7px 15px;border-radius:99px;border:1px solid var(--line);font-size:.9rem;color:var(--muted);transition:.2s}
.tab:hover{color:var(--text);border-color:var(--muted)}
.tab[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px}
.card{text-align:left;display:block}
.thumb{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--panel);border:1px solid var(--line);transition:border-color .2s}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fallback{position:absolute;inset:0;background:radial-gradient(circle at 25% 30%,#3b1f5c,transparent 55%),radial-gradient(circle at 80% 80%,#0f4a63,transparent 50%),#1a1626}
.card:hover .thumb{border-color:var(--accent)}
.dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.7);font-size:.75rem;padding:2px 7px;border-radius:5px;z-index:2}
.card h3{font-family:'DM Sans',sans-serif;font-size:1rem;letter-spacing:0;margin:12px 0 2px;font-weight:700}
.card small{color:var(--muted);font-size:.85rem}
.empty{color:var(--muted);padding:30px 0}

/* contact */
#contact{border-top:1px solid var(--line);padding:44px 0 56px}
#contact h2{font-size:1.6rem;margin-bottom:18px}
.links{max-width:420px}
.links a{display:flex;justify-content:space-between;padding:13px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);transition:color .2s}
.links a:hover{color:var(--accent)}
.links span:last-child{color:var(--muted)}

footer{border-top:1px solid var(--line);padding:22px 0;color:var(--muted);font-size:.85rem}

/* modal */
.modal{position:fixed;inset:0;background:rgba(8,6,14,.92);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modal .box{width:100%;max-width:1000px}
.modal .frame{aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.modal iframe{width:100%;height:100%;border:0}
.modal .note{padding:24px;text-align:center;color:var(--muted)}
.modal .cap{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:14px}
.modal .cap h3{font-family:'DM Sans',sans-serif;font-size:1.05rem;letter-spacing:0}
.close{border:1px solid var(--line);border-radius:99px;padding:7px 16px;font-size:.9rem;flex-shrink:0}
.close:hover{border-color:var(--text)}

@media(max-width:600px){
  .top{padding-top:40px}
  nav{gap:18px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a href="#top" class="logo">IZESAKI<i>.</i></a>
    <nav>
      <a href="#work">Work</a>
      <a href="#contact">Contact</a>
    </nav>
  </div>
</header>

<main id="top">
  <div class="wrap top">
    <h1>AI Video Portfolio: Short Movies, Music Videos, ADs, and Shorts</h1>
  </div>

  <section id="work">
    <div class="wrap">
      <div class="tabs" id="tabs"></div>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <section id="contact">
    <div class="wrap">
      <h2>Contact</h2>
      <div class="links">
        <a href="https://x.com/izesaki" target="_blank" rel="noopener"><span>X</span><span>@izesaki</span></a>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">© 2026 izesaki</div>
</footer>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Video player">
  <div class="box">
    <div class="frame" id="frame"></div>
    <div class="cap"><h3 id="mtitle"></h3><button class="close" id="close">Close</button></div>
  </div>
</div>

<script>
/* ============ EDIT THIS PART ============
   id    = YouTube video ID (the part after v= in the link)
           example: youtube.com/watch?v=abc123XYZ  ->  id: "abc123XYZ"
   cat   = category (any name, becomes a filter tab automatically)
   dur   = duration (optional)
======================================== */
const VIDEOS = [
  { id:"21vqGvPlYnA", title:"Handphone Ad", cat:"AD", dur:"1:58" },
  { id:"E0n2AU86D34", title:"BLUE WIND PARFUM", cat:"AD", dur:"1:01" },
  { id:"kkFGPSRpT68", title:"C1 - SEE IT DIFFERENTLY", cat:"AD", dur:"0:58" },
  { id:"VOXjREDl_OA", title:"Street Fighter", cat:"Shorts", dur:"0:25" },
  { id:"VIDEO_ID_5", title:"Still Productions (upcoming)", cat:"Short Movie", dur:"40:05" },
  { id:"TNFQy56zkww", title:"Choose Peace AMV", cat:"Music Video", dur:"1.01" }
  { id:"i8XSkWiKx48", title:"Lost Control", cat:"Shorts", dur:"0:54" },
  { id:"2YnF93hnFbc", title:"THE LAST PIECE", cat:"Shorts", dur:"2:05" },
  { id:"67msbFQDxKo", title:"WW3", cat:"Shorts", dur:"0:27" },
  { id:"EnKrvqR3bGc", title:"REQUIRES A", cat:"Shorts", dur:"0:58" },
  { id:"DvOWld2J4tA", title:"New World", cat:"Shorts", dur:"0:42" },
  { id:"dDlLH0PcSo4", title:"Buy Now", cat:"AD", dur:"0:30" },
  { id:"1jaj_Y8qdBU", title:"Hazl UGC", cat:"AD", dur:"0:43" },
];
/* ========================================= */

const $ = s => document.querySelector(s);
const thumbUrl = id => `https://img.youtube.com/vi/${id}/hqdefault.jpg`;
const isPlaceholder = id => id.startsWith("VIDEO_ID");

function thumbHTML(v){
  return `<div class="fallback"></div>` + (isPlaceholder(v.id) ? "" :
    `<img src="${thumbUrl(v.id)}" alt="" loading="lazy" onerror="this.remove()">`);
}

const cats = ["All", ...new Set(VIDEOS.map(v => v.cat))];
let active = "All";
function renderTabs(){
  $("#tabs").innerHTML = cats.map(c =>
    `<button class="tab" aria-pressed="${c===active}" data-c="${c}">${c}</button>`).join("");
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => { active = b.dataset.c; renderTabs(); renderGrid(); });
}
function renderGrid(){
  const list = VIDEOS.filter(v => active==="All" || v.cat===active);
  $("#grid").innerHTML = list.length ? list.map(v => `
    <button class="card" data-id="${v.id}">
      <div class="thumb">${thumbHTML(v)}${v.dur?`<span class="dur">${v.dur}</span>`:""}</div>
      <h3>${v.title}</h3><small>${v.cat}</small>
    </button>`).join("") : `<p class="empty">No videos in this category yet.</p>`;
  document.querySelectorAll(".card").forEach(c => c.onclick = () => openVideo(VIDEOS.find(v => v.id===c.dataset.id)));
}
renderTabs(); renderGrid();

const modal = $("#modal");
function openVideo(v){
  $("#mtitle").textContent = v.title;
  $("#frame").innerHTML = isPlaceholder(v.id)
    ? `<p class="note">This is a placeholder. Replace the video <b>id</b> in the VIDEOS list with your YouTube video ID.</p>`
    : `<iframe src="https://www.youtube.com/embed/${v.id}?autoplay=1&rel=0" allow="autoplay; encrypted-media; fullscreen" allowfullscreen title="${v.title}"></iframe>`;
  modal.classList.add("open");
  $("#close").focus();
}
function closeVideo(){ modal.classList.remove("open"); $("#frame").innerHTML = ""; }
$("#close").onclick = closeVideo;
modal.onclick = e => { if(e.target===modal) closeVideo(); };
document.addEventListener("keydown", e => { if(e.key==="Escape") closeVideo(); });
</script>
</body>
</html>
