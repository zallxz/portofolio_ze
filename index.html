<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>izesaki, AI filmmaker</title>
<meta name="description" content="Independent AI filmmaker making short films, music videos, and ads.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<noscript><style>.title{opacity:1!important}</style></noscript>
<style>
:root{
  color-scheme:light;
  --bg:#f3f3f1;
  --raise:#e2e2de;
  --line:#d4d4cf;
  --text:#000;
  --muted:#636361;
  /* the cinema frame and the player stay black in both modes: they are the screen */
  --cinema:#000;
  --cinema-text:#f2f2f2;
  --cinema-muted:#9d9d9d;
  --scrim:rgba(0,0,0,.3);
  --pad:clamp(16px,3vw,40px);
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --bg:#000;
    --raise:#151515;
    --line:#272727;
    --text:#ececec;
    --muted:#8c8c8c;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;background:var(--bg)}
body{background:var(--bg);color:var(--text);font-family:'Archivo',system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid currentColor;outline-offset:3px}
::selection{background:var(--text);color:var(--bg)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- hero: a letterboxed frame, the lead film plays in the picture area ---------- */
.hero{background:var(--cinema);color:var(--cinema-text)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:0 var(--pad);min-height:clamp(52px,8vh,84px);font-size:.9rem}
.bar .note{color:var(--cinema-muted)}
.socials{display:flex;gap:22px;font-weight:600}
.socials a{text-decoration:none}
.socials a:hover{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1.5px}

.screen{position:relative;height:calc(100vw / 2.39);max-height:calc(100vh - 230px);min-height:300px;overflow:hidden;background:var(--cinema)}
@supports (height:100svh){.screen{max-height:calc(100svh - 230px)}}
.screen img,.screen video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.screen img{opacity:0;transition:opacity .6s}
.screen img.on{opacity:1}
.screen video{opacity:0;transition:opacity 1s}
.screen video.on{opacity:1}
.screen::after{content:"";position:absolute;inset:0;background:var(--scrim);pointer-events:none}

.title{
  position:absolute;inset:0;z-index:1;display:grid;place-items:center;pointer-events:none;
  font-weight:800;font-stretch:125%;
  font-size:min(18vw,260px);line-height:.9;letter-spacing:-.05em;white-space:nowrap;
  opacity:0;
}
.ready .title{opacity:1;animation:widen 1.7s cubic-bezier(.2,.8,.2,1) both}
@keyframes widen{
  from{font-stretch:62%;letter-spacing:-.015em}
  to{font-stretch:125%;letter-spacing:-.05em}
}
.play{position:absolute;inset:0;z-index:2;display:flex;align-items:flex-end;padding:var(--pad)}
.play:focus-visible{outline-offset:-6px}
.play .label{display:inline-flex;align-items:center;gap:12px;font-weight:600}
.play .label small{font-size:.85rem;font-weight:400;color:var(--cinema-muted)}
.play svg{width:38px;height:38px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5}
.play svg path{fill:currentColor;stroke:none}
.play:hover .label span:first-of-type{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px}

/* the bio sits in the lower bar, set like burned-in subtitles */
.subs{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:clamp(96px,14vh,140px);padding:16px var(--pad) 24px;text-align:center}
.subs p{max-width:48ch;font-size:clamp(1rem,1.6vw,1.25rem);font-weight:500;font-stretch:96%;line-height:1.35;text-shadow:0 1px 2px var(--cinema)}
.subs a{text-underline-offset:4px;text-decoration-thickness:1px}

@media (max-width:640px){
  .bar .note{display:none}
  .bar{justify-content:flex-end}
  .screen{height:auto;aspect-ratio:1;max-height:none;min-height:0}
  .title{font-size:21vw}
}

/* ---------- work ---------- */
.filters{
  position:sticky;top:0;z-index:30;
  display:flex;gap:28px;
  padding:14px var(--pad);
  overflow-x:auto;scrollbar-width:none;
  background:var(--bg);border-bottom:1px solid var(--line);
}
.filters::-webkit-scrollbar{display:none}
.f{flex:none;font-weight:500;color:var(--muted);padding:2px 0}
.f:hover{color:var(--text)}
.f[aria-pressed="true"]{color:var(--text);text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:7px}
.f span{margin-left:6px;font-size:.8em;font-variant-numeric:tabular-nums;color:var(--muted)}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));
  gap:44px 20px;
  padding:32px var(--pad) 0;
}
.tile{display:flex;flex-direction:column;gap:12px;width:100%}
.thumb{position:relative;display:block;aspect-ratio:16/9;overflow:hidden;background:var(--raise)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.thumb em{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-size:.9rem;color:var(--muted)}
.meta{display:grid;grid-template-columns:1fr auto;gap:2px 16px;align-items:baseline}
.meta b{font-weight:600;font-size:1.05rem;line-height:1.25}
.meta .dur{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.meta .sub{grid-column:1/-1;font-size:.85rem;color:var(--muted)}
.tile[disabled]{cursor:default}
.tile[disabled] b{color:var(--muted)}
.tile:focus-visible{outline:none}
.tile:focus-visible .thumb{outline:2px solid var(--text);outline-offset:3px}
@media (hover:hover){
  .tile:not([disabled]):hover img{transform:scale(1.03)}
  .tile:not([disabled]):hover b{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px}
}

.foot{display:flex;justify-content:space-between;gap:16px;margin-top:clamp(72px,10vw,120px);padding:20px var(--pad) 24px;border-top:1px solid var(--line);font-size:.9rem;color:var(--muted)}
.foot a{text-underline-offset:4px}
.foot a:hover{color:var(--text)}

/* ---------- player ---------- */
.player{
  position:fixed;inset:0;z-index:100;background:var(--cinema);color:var(--cinema-text);
  display:flex;align-items:center;justify-content:center;
  padding:12px var(--pad);
  opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s;
}
.player.open{opacity:1;visibility:visible;transition:opacity .25s}
.pbox{--r:1.7778;display:flex;flex-direction:column;width:min(100%,calc((100vh - 140px)*var(--r)))}
@supports (height:100dvh){.pbox{width:min(100%,calc((100dvh - 140px)*var(--r)))}}
.pbar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-bottom:8px}
.pbar h2{font-size:1rem;font-weight:600;line-height:1.25}
.pbar p{font-size:.85rem;color:var(--cinema-muted)}
.frame{width:100%;aspect-ratio:var(--r);background:var(--cinema)}
.frame video{display:block;width:100%;height:100%;border:0;background:var(--cinema);object-fit:contain}
.frame .wait{display:grid;place-items:center;height:100%;color:var(--cinema-muted);font-size:.9rem}
.fail{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center;background:var(--cinema) center/cover}
.fail::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.75)}
.fail p,.fail button{position:relative;max-width:32ch;font-size:.95rem}
.retry{padding:9px 18px;border:1px solid var(--cinema-muted);border-radius:999px;font-weight:600}
.retry:hover{border-color:var(--cinema-text)}
.pnav{display:flex;justify-content:center;align-items:center;gap:8px;padding-top:6px}
.pnav span{min-width:4.5em;text-align:center;font-size:.85rem;color:var(--cinema-muted);font-variant-numeric:tabular-nums}
.ib{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;color:var(--cinema-muted);transition:color .2s,background-color .2s}
.ib:hover{color:var(--cinema-text);background:rgba(255,255,255,.1)}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ib[hidden],.pnav span[hidden]{display:none}
#pclose{margin-right:-11px}
.pact{display:flex;align-items:center;gap:12px;flex:none}
.pext{font-size:.85rem;color:var(--cinema-muted);text-underline-offset:4px}
.pext:hover{color:var(--cinema-text)}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .ready .title{animation:none}
  *{transition:none!important}
}
</style>
</head>
<body>

<header class="hero" id="top">
  <div class="bar">
    <span class="note">Open to commissions and collaborations</span>
    <nav class="socials" aria-label="Contact">
      <a href="https://x.com/izesaki" target="_blank" rel="noopener">X</a>
      <a href="https://www.instagram.com/izesaki" target="_blank" rel="noopener">Instagram</a>
      <a href="https://www.tiktok.com/@zeesai_" target="_blank" rel="noopener">TikTok</a>
    </nav>
  </div>

  <div class="screen" id="screen">
    <img id="hposter" alt="" referrerpolicy="no-referrer">
    <video id="hvideo" muted loop playsinline preload="none" aria-hidden="true"></video>
    <h1 class="title">izesaki</h1>
    <button class="play" id="hplay" hidden>
      <span class="label">
        <svg viewBox="0 0 38 38" aria-hidden="true"><circle cx="19" cy="19" r="18"/><path d="M15.5 12.5l10 6.5-10 6.5z"/></svg>
        <span id="htitle"></span>
        <small id="hmeta"></small>
      </span>
    </button>
  </div>

  <div class="subs">
    <p>Independent filmmaker working with AI. Short films, music videos, and ads that would normally need a full crew.</p>
    <p>Winner of <a href="https://x.com/izesaki/status/2110455906077188266" target="_blank" rel="noopener">Best UGC on OpenArt</a>.</p>
  </div>
</header>

<main>
  <h2 class="sr">Work</h2>
  <nav class="filters" id="filters" aria-label="Filter work by category"></nav>
  <div class="grid" id="grid"></div>
</main>

<footer class="foot">
  <span>© 2026 izesaki</span>
  <a href="#top">Back to top</a>
</footer>

<div class="player" id="player" role="dialog" aria-modal="true" aria-labelledby="ptitle" aria-hidden="true">
 <div class="pbox" id="pbox">
  <div class="pbar">
    <div><h2 id="ptitle"></h2><p id="pmeta"></p></div>
    <div class="pact">
      <a class="pext" id="pext" href="#" target="_blank" rel="noopener">Open on X</a>
      <button class="ib" id="pclose" aria-label="Close video"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </div>
  <div class="frame" id="frame"></div>
  <div class="pnav">
    <button class="ib" id="pprev" aria-label="Previous video"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span id="pcount"></span>
    <button class="ib" id="pnext" aria-label="Next video"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
 </div>
</div>

<script>
/* ============ EDIT THIS PART ============
   Each line is one video from an X post.
   x     = link to the X post with the video
   title = name shown on the tile
   cat   = category (becomes a filter automatically)
   The first video plays silently in the header, so put your best work first.
   Duration and date are read from the post automatically.
   A line with x:"" shows as "Coming soon".
======================================== */
const VIDEOS = [
  { x:"https://x.com/izesaki/status/2115509092802502699", title:"Another Life", cat:"Short films" },
  { x:"https://x.com/izesaki/status/2115004058096554144", title:"The Last Letter", cat:"Short films" },
  { x:"https://x.com/izesaki/status/2114293588033232980", title:"God in the Static", cat:"Music videos" },
  { x:"https://x.com/izesaki/status/2113912084673245439", title:"The House Never Emptied", cat:"Short films" },
  { x:"https://x.com/izesaki/status/2113446943800340755", title:"The Face That Remains", cat:"Short films" },
  { x:"https://x.com/izesaki/status/2112272459194118215", title:"AIZE Liptint", cat:"Ads" },
  { x:"https://x.com/izesaki/status/2111163548004975077", title:"Flower Fever", cat:"Music videos" },
  { x:"https://x.com/izesaki/status/2111076371724488750", title:"Aizento Time Machine", cat:"Ads" },
  { x:"https://x.com/izesaki/status/2109753291492270490", title:"All Eyes to Kalimantan", cat:"Short films" },
  { x:"https://x.com/izesaki/status/2106090261277515884", title:"Hazl", cat:"Ads" },
  { x:"https://x.com/izesaki/status/2102663694824186267", title:"AIZE Remnant", cat:"Ads" },
  { x:"https://x.com/izesaki/status/2101740798647935385", title:"The Last Piece", cat:"Short films" },
  { x:"https://x.com/izesaki/status/2100299004689215532", title:"Handphone", cat:"Ads" },
  { x:"https://x.com/izesaki/status/2099904225027543415", title:"C1: See It Differently", cat:"Ads" },
  { x:"https://x.com/izesaki/status/2099817993312354664", title:"Blue Wind Parfum", cat:"Ads" },
  { x:"https://x.com/izesaki/status/2098903195804406080", title:"Choose Peace (AMV)", cat:"Music videos" },
];
/* ========================================= */

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const X_RE = /(?:x|twitter)\.com\/([^\/?#]+)\/status\/(\d+)/i;
/* an X post id carries its own timestamp, so the month comes for free */
const postDate = id => {
  try { return new Date(Number((BigInt(id) >> 22n) + 1288834974657n)).toLocaleDateString("en", { month: "short", year: "numeric" }); }
  catch { return ""; }
};
VIDEOS.forEach(v => {
  const m = String(v.x || "").match(X_RE);
  if (m) { v.user = m[1]; v.tid = m[2]; v.date = postDate(m[2]); }
});
const soon = v => !v.tid;
const single = c => c.replace(/s$/, "");
const subline = v => [single(v.cat), v.date].filter(Boolean).join(", ");
const xCache = {}, xInfo = {};
const fmtDur = s => { s = Math.round(s); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const saveData = !!(navigator.connection && navigator.connection.saveData);

function mp4s(vid){
  return (vid.variants || [])
    .filter(x => x.url && /mp4/i.test(x.content_type || x.url) && x.bitrate)
    .sort((a, b) => a.bitrate - b.bitrate);
}
function pickUnder(list, cap){
  const fit = list.filter(x => x.bitrate <= cap);
  return (fit.length ? fit[fit.length - 1] : list[0]).url;
}
/* phones get a lighter file so playback starts faster */
function pickUrl(vid){
  const list = mp4s(vid);
  if (!list.length) return vid.url;
  const small = Math.min(screen.width, screen.height) * (window.devicePixelRatio || 1) < 1100;
  return pickUnder(list, small ? 2500000 : Infinity);
}
/* the silent header loop only needs a light file */
function pickBg(vid){
  const list = mp4s(vid);
  return list.length ? pickUnder(list, 2300000) : vid.url;
}
function getX(v){
  if (!xCache[v.tid]) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 8000);
    xCache[v.tid] = fetch(`https://api.fxtwitter.com/${encodeURIComponent(v.user)}/status/${v.tid}`, { signal: ctrl.signal })
      .then(r => r.ok ? r.json() : null)
      .then(j => {
        const t = j && (j.tweet || j.status);
        const vid = t && t.media && t.media.videos && t.media.videos[0];
        if (!vid || !vid.url) return null;
        return { url: pickUrl(vid), bg: pickBg(vid), thumb: vid.thumbnail_url || "", w: vid.width, h: vid.height, dur: vid.duration };
      })
      .catch(() => null)
      .then(info => {
        if (info) xInfo[v.tid] = info;
        else delete xCache[v.tid]; /* allow a fresh try next time */
        return info;
      })
      .finally(() => clearTimeout(timer));
  }
  return xCache[v.tid];
}

Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))])
  .then(() => document.documentElement.classList.add("ready"));

/* ---------- header film ---------- */
const lead = VIDEOS.findIndex(v => !soon(v));
const hvideo = $("#hvideo");
let heroVisible = true;
function heroPlay(){
  if (hvideo.src && heroVisible && !player.classList.contains("open")) hvideo.play().catch(() => {});
}
if (lead > -1) {
  const v = VIDEOS[lead];
  $("#htitle").textContent = v.title;
  $("#hmeta").textContent = single(v.cat);
  $("#hplay").setAttribute("aria-label", "Play " + v.title);
  $("#hplay").hidden = false;
  $("#hplay").onclick = () => openAt(lead);
  getX(v).then(info => {
    if (!info) return;
    if (info.thumb) {
      const img = $("#hposter");
      img.onload = () => img.classList.add("on");
      img.src = info.thumb;
    }
    if (info.dur) $("#hmeta").textContent = single(v.cat) + ", " + fmtDur(info.dur);
    if (reduceMotion || saveData) return; /* the still frame is enough */
    hvideo.addEventListener("playing", () => hvideo.classList.add("on"), { once: true });
    hvideo.src = info.bg;
    heroPlay();
  });
  new IntersectionObserver(([e]) => {
    heroVisible = e.isIntersecting;
    heroVisible ? heroPlay() : hvideo.pause();
  }).observe($("#screen"));
}

/* ---------- work grid ---------- */
const cats = ["All", ...new Set(VIDEOS.map(v => v.cat))];
let active = "All";
let queue = [];

function renderFilters(){
  $("#filters").innerHTML = cats.map(c => {
    const n = c === "All" ? VIDEOS.length : VIDEOS.filter(v => v.cat === c).length;
    return `<button class="f" aria-pressed="${c===active}" data-c="${esc(c)}">${esc(c)}<span>${n}</span></button>`;
  }).join("");
}

function tileHTML(v, i){
  if (soon(v)) {
    return `<button class="tile" disabled aria-label="${esc(v.title)}, coming soon">
      <span class="thumb"><em>Coming soon</em></span>
      <span class="meta"><b>${esc(v.title)}</b><span class="sub">${esc(single(v.cat))}</span></span>
    </button>`;
  }
  return `<button class="tile" data-i="${i}" aria-label="Play ${esc(v.title)}">
    <span class="thumb"><img alt="" hidden loading="lazy" referrerpolicy="no-referrer"></span>
    <span class="meta"><b>${esc(v.title)}</b><span class="dur">${v.dur || ""}</span><span class="sub">${esc(subline(v))}</span></span>
  </button>`;
}

function renderGrid(){
  const list = VIDEOS.map((v, i) => i).filter(i => active === "All" || VIDEOS[i].cat === active);
  queue = list.filter(i => !soon(VIDEOS[i]));
  $("#grid").innerHTML = list.map(i => tileHTML(VIDEOS[i], i)).join("");
  list.forEach(i => {
    const v = VIDEOS[i];
    if (soon(v)) return;
    getX(v).then(info => {
      const tile = $(`.tile[data-i="${i}"]`);
      if (!tile || !info) return;
      if (info.thumb) { const img = tile.querySelector("img"); img.src = info.thumb; img.hidden = false; }
      if (!v.dur && info.dur) v.dur = fmtDur(info.dur);
      if (v.dur) tile.querySelector(".dur").textContent = v.dur;
    });
  });
}

$("#filters").addEventListener("click", e => {
  const b = e.target.closest(".f");
  if (!b) return;
  active = b.dataset.c;
  renderFilters();
  renderGrid();
});
$("#grid").addEventListener("click", e => {
  const t = e.target.closest(".tile[data-i]");
  if (t) openAt(+t.dataset.i);
});
renderFilters();
renderGrid();

/* ---------- player ---------- */
const player = $("#player");
const page = [$("header.hero"), $("main"), $("footer")];
let cur = -1, lastFocus = null;

function fail(v){
  const fr = $("#frame");
  const info = xInfo[v.tid];
  fr.innerHTML = `<div class="fail"${info && info.thumb ? ` style="background-image:url('${esc(info.thumb)}')"` : ""}>
    <p>This video didn't load. Check your connection and try again.</p>
    <button class="retry" type="button">Try again</button>
  </div>`;
  fr.querySelector(".retry").onclick = () => { delete xInfo[v.tid]; delete xCache[v.tid]; openAt(VIDEOS.indexOf(v)); };
}
function mount(v, info){
  if (!info) return fail(v);
  const fr = $("#frame");
  if (info.w && info.h) $("#pbox").style.setProperty("--r", (info.w / info.h).toFixed(4));
  const vid = document.createElement("video");
  vid.controls = true;
  vid.playsInline = true;
  vid.preload = "auto";
  if (info.thumb) vid.poster = info.thumb;
  let retried = false;
  vid.addEventListener("error", () => {
    if (VIDEOS[cur] !== v) return;
    if (!retried) {               /* one quiet retry, picking up where it stopped */
      retried = true;
      const t = vid.currentTime;
      setTimeout(() => { vid.load(); vid.currentTime = t; vid.play().catch(() => {}); }, 800);
    } else fail(v);
  });
  vid.src = info.url;
  fr.replaceChildren(vid);
  vid.play().catch(() => {}); /* if the browser blocks autoplay, the play button is still there */
  if (!v.dur && info.dur) v.dur = fmtDur(info.dur);
  $("#pmeta").textContent = subline(v) + (v.dur ? ", " + v.dur : "");
}
function openAt(i){
  const v = VIDEOS[i];
  if (!player.classList.contains("open")) lastFocus = document.activeElement;
  cur = i;
  $("#ptitle").textContent = v.title;
  $("#pmeta").textContent = subline(v) + (v.dur ? ", " + v.dur : "");
  $("#pext").href = v.x;
  const pos = queue.indexOf(i);
  $("#pcount").textContent = pos > -1 ? `${pos + 1} / ${queue.length}` : "";
  const multi = queue.length > 1;
  $("#pprev").hidden = !multi;
  $("#pnext").hidden = !multi;
  $("#pcount").hidden = !multi;
  player.classList.add("open");
  player.setAttribute("aria-hidden", "false");
  page.forEach(el => el.inert = true);
  document.body.style.overflow = "hidden";
  hvideo.pause();
  $("#pclose").focus();

  const fr = $("#frame");
  $("#pbox").style.removeProperty("--r");
  if (v.tid in xInfo) {
    mount(v, xInfo[v.tid]); /* already loaded: start right away, inside the click */
  } else {
    fr.innerHTML = `<div class="wait">Loading video</div>`;
    getX(v).then(info => {
      if (cur === i && player.classList.contains("open")) mount(v, info);
    });
  }
}
function closePlayer(){
  player.classList.remove("open");
  player.setAttribute("aria-hidden", "true");
  page.forEach(el => el.inert = false);
  $("#frame").innerHTML = "";
  document.body.style.overflow = "";
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
  heroPlay();
}
function step(d){
  if (queue.length < 2) return;
  const pos = queue.indexOf(cur);
  openAt(queue[(pos + d + queue.length) % queue.length]);
}
$("#pclose").onclick = closePlayer;
player.addEventListener("click", e => { if (e.target === player) closePlayer(); });
$("#pprev").onclick = () => step(-1);
$("#pnext").onclick = () => step(1);
document.addEventListener("keydown", e => {
  if (!player.classList.contains("open")) return;
  if (e.key === "Escape") closePlayer();
  if (e.target.tagName === "VIDEO") return; /* let the video keep its own arrow-key seeking */
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});
</script>
</body>
