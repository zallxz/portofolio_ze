<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>izesaki — AI Video Portfolio</title>
<meta name="description" content="AI video portfolio: short movies, music videos, ADs, and shorts.">
<meta name="theme-color" content="#08080b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<noscript><style>.wordmark{opacity:1!important}</style></noscript>
<style>
:root{
  --bg:#08080b;
  --panel:#111116;
  --line:#26262e;
  --text:#f1f1f3;
  --muted:#8c8c99;
  --red:#dc3a2a;
  --red-soft:#ff7b6b;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;background:var(--bg)}
body{background:var(--bg);color:var(--text);font-family:'Archivo',system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
:focus-visible{outline:3px solid var(--text);outline-offset:3px}
::selection{background:var(--red);color:#fff}

/* masthead */
.masthead{padding:clamp(20px,4vw,44px) 20px 36px}
.wordmark{
  color:var(--text);
  font-weight:800;
  font-stretch:125%;
  font-size:min(18.5vw,270px);
  line-height:.95;
  letter-spacing:-.05em;
  white-space:nowrap;
  overflow:hidden;
  opacity:0;
}
.ready .wordmark{opacity:1;animation:widen 1.7s cubic-bezier(.2,.8,.2,1) both}
@keyframes widen{
  from{font-stretch:62%;letter-spacing:-.015em}
  to{font-stretch:125%;letter-spacing:-.05em}
}
.sub{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:18px 32px;margin-top:clamp(14px,2.5vw,28px)}
.sub p{font-size:clamp(1.05rem,2.2vw,1.45rem);font-weight:450;line-height:1.3;max-width:34ch}
.jump{font-weight:600;white-space:nowrap;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px;transition:color .2s}
.jump:hover{color:var(--red)}

/* filters */
.filters{
  position:sticky;top:0;z-index:30;
  display:flex;gap:26px;
  padding:14px 20px;
  overflow-x:auto;scrollbar-width:none;
  background:rgba(8,8,11,.92);border-bottom:1px solid var(--line);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.filters::-webkit-scrollbar{display:none}
.f{flex:none;font-size:.98rem;font-weight:500;color:var(--muted);padding:2px 0;transition:color .2s}
.f:hover{color:var(--text)}
.f[aria-pressed="true"]{color:var(--text);font-weight:650;text-decoration:underline;text-decoration-color:var(--red);text-decoration-thickness:2px;text-underline-offset:7px}
.f sup{font-size:.62em;margin-left:3px;font-weight:500;color:var(--muted)}

/* wall of work */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr));gap:6px}
.tile{position:relative;display:block;width:100%;aspect-ratio:16/9;overflow:hidden;background:var(--panel);color:var(--text)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scrim{position:absolute;inset:0;background:linear-gradient(to top,rgba(8,8,11,.9),rgba(8,8,11,0) 55%)}
.cap{position:absolute;left:16px;right:76px;bottom:14px;display:flex;flex-direction:column;gap:2px}
.cap b{font-weight:650;font-size:1.05rem;line-height:1.2}
.cap i{font-style:normal;font-size:.82rem;opacity:.8}
.len{position:absolute;right:16px;bottom:14px;font-size:.82rem;font-variant-numeric:tabular-nums}
.tile[disabled]{cursor:default;background:var(--panel);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.tile[disabled] .scrim{display:none}
.tile:focus-visible{outline-color:var(--text);outline-offset:-4px}
.play{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:var(--red);opacity:0;transform:scale(.7);transition:opacity .25s,transform .25s}
.play::after{content:"";position:absolute;left:25px;top:20px;border-style:solid;border-width:12px 0 12px 19px;border-color:transparent transparent transparent #fff}
.tile{isolation:isolate}
.tile img{z-index:0}
.tile:not([disabled])::after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;box-shadow:inset 0 0 0 0 var(--red);transition:box-shadow .2s}
.scrim{z-index:2}
.cap,.len,.play{z-index:3}
@media (hover:hover){
  .tile:not([disabled]):hover::after,.tile:not([disabled]):focus-visible::after{box-shadow:inset 0 0 0 3px var(--red)}
  .tile:not([disabled]):hover .play{opacity:1;transform:none}
}
.tile:not([disabled]):focus-visible .play{opacity:1;transform:none}

/* contact */
.contact{
  display:flex;justify-content:space-between;align-items:center;gap:16px;
  margin-top:6px;padding:16px 20px;
  background:var(--red);color:#fff;text-decoration:none;
  transition:background .2s,color .2s;
}
.contact span{font-size:.95rem;font-weight:500}
.contact b{font-size:1.25rem;font-weight:800;font-stretch:125%;letter-spacing:-.02em;line-height:1.1}
.contact:hover,.contact:focus-visible{background:var(--text);color:var(--red)}
.contact:focus-visible{outline-color:#fff;outline-offset:-4px}
.foot{display:flex;justify-content:space-between;gap:16px;padding:16px 20px 22px;font-size:.9rem;color:var(--muted)}
.foot a{text-underline-offset:4px;transition:color .2s}
.foot a:hover{color:var(--text)}

/* screening room */
.player{position:fixed;inset:0;z-index:100;background:#000;color:var(--text);display:none;flex-direction:column;padding:16px 20px 18px}
.player.open{display:flex}
.ptop,.pbottom{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.ptop{align-items:flex-start;font-size:.9rem;color:rgba(255,255,255,.75)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:12px 0}
.frame{width:min(100%,calc((100vh - 170px)*16/9));aspect-ratio:16/9;background:#000}
@supports (height:100dvh){.frame{width:min(100%,calc((100dvh - 170px)*16/9))}}
.frame iframe{display:block;width:100%;height:100%;border:0}
.pbottom h3{font-size:1.1rem;font-weight:650;line-height:1.25}
.pbottom p{font-size:.85rem;color:rgba(255,255,255,.7)}
.pnav{display:flex;gap:22px;flex:none}
.u{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:5px;transition:color .2s}
.u:hover{color:var(--red-soft)}
.player :focus-visible{outline-color:var(--red-soft)}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .ready .wordmark{animation:none}
  *{transition:none!important}
}
</style>
</head>
<body>

<header class="masthead" id="top">
  <h1 class="wordmark">izesaki</h1>
  <div class="sub">
    <p>AI Video Portfolio: Short Movies, Music Videos, ADs, and Shorts</p>
    <a class="jump" href="#contact">Contact</a>
  </div>
</header>

<main>
  <nav class="filters" id="filters" aria-label="Filter work by category"></nav>
  <div class="grid" id="grid"></div>
</main>

<a class="contact" id="contact" href="https://x.com/izesaki" target="_blank" rel="noopener">
  <span>Contact on X</span>
  <b>@izesaki</b>
</a>

<footer class="foot">
  <span>© 2026 izesaki</span>
  <a href="#top">Back to top</a>
</footer>

<div class="player" id="player" role="dialog" aria-modal="true" aria-label="Video player">
  <div class="ptop">
    <span id="pcount"></span>
    <button class="u" id="pclose">Close</button>
  </div>
  <div class="stage"><div class="frame" id="frame"></div></div>
  <div class="pbottom">
    <div><h3 id="ptitle"></h3><p id="pmeta"></p></div>
    <div class="pnav">
      <button class="u" id="pprev">Previous</button>
      <button class="u" id="pnext">Next</button>
    </div>
  </div>
</div>

<script>
/* ============ EDIT THIS PART ============
   id    = YouTube video ID (the part after v= in the link)
           example: youtube.com/watch?v=abc123XYZ  ->  id: "abc123XYZ"
   cat   = category (any name, becomes a filter automatically)
   dur   = duration (optional)
   An id that starts with VIDEO_ID shows as "Coming soon".
   Every line must end with a comma.
======================================== */
const VIDEOS = [
  { id:"21vqGvPlYnA", title:"Handphone Ad", cat:"AD", dur:"1:58" },
  { id:"E0n2AU86D34", title:"BLUE WIND PARFUM", cat:"AD", dur:"1:01" },
  { id:"kkFGPSRpT68", title:"C1 - SEE IT DIFFERENTLY", cat:"AD", dur:"0:58" },
  { id:"VOXjREDl_OA", title:"Street Fighter", cat:"Shorts", dur:"0:25" },
  { id:"VIDEO_ID_5", title:"Still Productions (upcoming)", cat:"Short Movie", dur:"40:05" },
  { id:"TNFQy56zkww", title:"Choose Peace AMV", cat:"Music Video", dur:"1:01" },
  { id:"i8XSkWiKx48", title:"Lost Control", cat:"Shorts", dur:"0:54" },
  { id:"2YnF93hnFbc", title:"THE LAST PIECE", cat:"Shorts", dur:"2:05" },
  { id:"67msbFQDxKo", title:"WW3", cat:"Shorts", dur:"0:27" },
  { id:"EnKrvqR3bGc", title:"REQUIRES A", cat:"Shorts", dur:"0:58" },
  { id:"DvOWld2J4tA", title:"New World", cat:"Shorts", dur:"0:42" },
  { id:"dDlLH0PcSo4", title:"Buy Now", cat:"AD", dur:"0:30" },
  { id:"1jaj_Y8qdBU", title:"Hazl UGC", cat:"AD", dur:"0:43" },
  { id:"VIDEO_ID_5", title:"Still Productions (upcoming)", cat:"Achievement", dur:"40:05" },
];
/* ========================================= */

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const soon = v => v.id.startsWith("VIDEO_ID");

/* page load: let the wordmark widen once the font is ready */
Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))])
  .then(() => document.documentElement.classList.add("ready"));

/* filters + grid */
const cats = ["All", ...new Set(VIDEOS.map(v => v.cat))];
let active = "All";
let queue = [];

function renderFilters(){
  $("#filters").innerHTML = cats.map(c => {
    const n = c === "All" ? VIDEOS.length : VIDEOS.filter(v => v.cat === c).length;
    return `<button class="f" aria-pressed="${c===active}" data-c="${esc(c)}">${esc(c)}<sup>${n}</sup></button>`;
  }).join("");
}

function tileHTML(v, i){
  if (soon(v)) {
    return `<button class="tile" disabled aria-label="${esc(v.title)}, coming soon">
      <span class="cap"><b>${esc(v.title)}</b><i>${esc(v.cat)}</i></span>
      <span class="len">Coming soon</span>
    </button>`;
  }
  const sd = `https://img.youtube.com/vi/${v.id}/sddefault.jpg`;
  const hq = `https://img.youtube.com/vi/${v.id}/hqdefault.jpg`;
  return `<button class="tile" data-i="${i}" aria-label="Play ${esc(v.title)}">
    <img src="${sd}" data-fb="${hq}" alt="" loading="lazy"
      onload="if(this.naturalWidth<200)this.src=this.dataset.fb"
      onerror="this.onerror=null;this.src=this.dataset.fb">
    <span class="scrim"></span>
    <span class="cap"><b>${esc(v.title)}</b><i>${esc(v.cat)}</i></span>
    ${v.dur ? `<span class="len">${esc(v.dur)}</span>` : ""}
    <span class="play" aria-hidden="true"></span>
  </button>`;
}

function renderGrid(){
  const list = VIDEOS.map((v, i) => i).filter(i => active === "All" || VIDEOS[i].cat === active);
  queue = list.filter(i => !soon(VIDEOS[i]));
  $("#grid").innerHTML = list.map(i => tileHTML(VIDEOS[i], i)).join("");
}

$("#filters").addEventListener("click", e => {
  const b = e.target.closest(".f");
  if (!b) return;
  active = b.dataset.c;
  renderFilters();
  renderGrid();
});
$("#grid").addEventListener("click", e => {
  const t = e.target.closest(".tile[data-i]");
  if (t) openAt(+t.dataset.i);
});
renderFilters();
renderGrid();

/* screening room */
const player = $("#player");
let cur = -1, lastFocus = null;

function openAt(i){
  const v = VIDEOS[i];
  if (!player.classList.contains("open")) lastFocus = document.activeElement;
  cur = i;
  $("#frame").innerHTML = `<iframe src="https://www.youtube.com/embed/${encodeURIComponent(v.id)}?autoplay=1&rel=0&playsinline=1" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen title="${esc(v.title)}"></iframe>`;
  $("#ptitle").textContent = v.title;
  $("#pmeta").textContent = v.cat + (v.dur ? ", " + v.dur : "");
  const pos = queue.indexOf(i);
  $("#pcount").textContent = pos > -1 ? `${pos + 1} of ${queue.length}` : "";
  const multi = queue.length > 1;
  $("#pprev").hidden = !multi;
  $("#pnext").hidden = !multi;
  player.classList.add("open");
  document.body.style.overflow = "hidden";
  $("#pclose").focus();
}
function closePlayer(){
  player.classList.remove("open");
  $("#frame").innerHTML = "";
  document.body.style.overflow = "";
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
}
function step(d){
  if (queue.length < 2) return;
  const pos = queue.indexOf(cur);
  openAt(queue[(pos + d + queue.length) % queue.length]);
}
$("#pclose").onclick = closePlayer;
$("#pprev").onclick = () => step(-1);
$("#pnext").onclick = () => step(1);
document.addEventListener("keydown", e => {
  if (!player.classList.contains("open")) return;
  if (e.key === "Escape") closePlayer();
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});
</script>
</body>
</html>
